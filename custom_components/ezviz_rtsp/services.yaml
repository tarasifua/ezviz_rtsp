capture_picture:
  target:
    entity:
      integration: ezviz_rtsp
      domain: camera
  fields:
    automatic:
      required: false
      default: false
      selector:
        boolean:
    min_interval:
      required: false
      example: 300
      selector:
        number:
          min: 0
          max: 86400
          step: 1
          mode: box
          unit_of_measurement: s

set_alarm_detection_sensibility:
  target:
    entity:
      integration: ezviz_rtsp
      domain: camera
  fields:
    level:
      required: true
      example: 3
      default: 3
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
    type_value:
      required: true
      example: "0"
      default: "0"
      selector:
        select:
          options:
            - "0"
            - "3"

wake_device:
  target:
    entity:
      integration: ezviz_rtsp
      domain: camera
