name: Release asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the zip to (for example v2.1.0)"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package and attach the zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: "actions/checkout@v5"
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Zip the integration
        working-directory: custom_components/ezviz_rtsp
        run: zip -r "$RUNNER_TEMP/ezviz_rtsp.zip" .

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/ezviz_rtsp.zip" --clobber